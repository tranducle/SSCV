[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sscv"
version = "1.0.0"
description = "Reproducibility package for Security-Sound Case Views"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "z3-solver==4.16.0.0",
  "psutil==7.0.0",
  "requests==2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]
